<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Student | College Placement Portal</title>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body>
    <header class="topbar">
      <div class="inner">
        <a class="brand" href="../index.html">College Placement Portal</a>
        <nav><a href="../index.html">Home</a><a href="../login.html">Logout</a></nav>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <div class="role">Student Panel</div>
        <a href="dashboard.html">Dashboard</a
        ><a href="profile.html" class="active">My Profile</a
        ><a href="jobs.html">Jobs</a
        ><a href="applications.html">My Applications</a
        ><a href="interviews.html">Interviews</a
        ><a href="resources.html">Career Resources</a>
        <a class="logout" href="../login.html">Logout</a>
      </aside>
      <main class="content">
        <div class="page-head">
          <h1>My profile</h1>
        </div>
        <form action="#" method="post" enctype="multipart/form-data">
          <div class="card">
            <h2>Personal details</h2>
            <div class="form-grid">
              <div class="row">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" value="Aarav Sharma" required>
              </div>
              <div class="row">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="aarav.sharma@college.edu" required>
              </div>
              <div class="row">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" value="+91 90000 00000" required>
              </div>
              <div class="row">
                <label for="dob">Date of birth</label>
                <input type="date" id="dob" name="dob" value="2004-03-14" required>
              </div>
            </div>
          </div>
          <div class="card section-gap">
            <h2>Academic details</h2>
            <div class="form-grid">
              <div class="row">
                <label for="roll">Roll number</label>
                <input type="text" id="roll" name="roll" value="CS2022-041" required>
              </div>
              <div class="row">
                <label for="branch">Branch</label>
                <select id="branch" name="branch">
                  <option>Computer Science</option>
                  <option>Information Technology</option>
                  <option>Electronics</option>
                  <option>Mechanical</option>
                  <option>Civil</option>
                  <option>Electrical</option>
                </select>
              </div>
              <div class="row">
                <label for="cgpa">Current CGPA</label>
                <input type="number" id="cgpa" name="cgpa" value="7.8" required>
              </div>
              <div class="row">
                <label for="backlogs">Active backlogs</label>
                <input type="number" id="backlogs" name="backlogs" value="0" required>
              </div>
            </div>
          </div>
          <div class="card section-gap">
            <h2>Skills and resume</h2>
            <div class="row">
              <label for="skills">Skills</label>
              <textarea id="skills" name="skills">HTML, CSS, JavaScript, Python, SQL</textarea>
            </div>
            <div class="row">
              <label for="resume">Upload resume (PDF)</label>
              <input type="file" id="resume" name="resume" accept=".pdf">
            </div>
            <p style="font-size:14px;color:#555">Current resume: Aarav_Sharma_Resume.pdf</p>
          </div>
          <p class="section-gap"><button class="btn" type="submit">Save profile</button></p>
        </form>
      </main>
    </div>
  </body>
</html>
